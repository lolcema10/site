name: Release

on:
  push:
    branches: [main]
    paths:
      - public/downloads/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish v1.5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5
          name: works 1.5
          body: |
            Сборки приложения works 1.5 со встроенной средой выполнения.

            Что добавлено:
            - голосовое управление: скажите, что открыть, или «закрой все окна»
            - в редакторе фото кисть «Линия» рисует прямой отрезок
            - в шашках бить не обязательно, начатый бой нужно закончить
            - кнопки таймера меняют обратный отсчёт на 1 секунду
            - в текстовых полях слово удаляется целиком: на Mac это ⌘⌫, на Windows — Ctrl+Delete

            - macOS: распакуйте архив и откройте works.app
            - Windows: распакуйте архив и запустите works.exe рядом с каталогом runtime
          files: |
            public/downloads/1.5/works-macos.zip
            public/downloads/1.5/works-windows.zip
          fail_on_unmatched_files: true
