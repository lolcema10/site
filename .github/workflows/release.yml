name: Release

on:
  push:
    branches: [main]
    paths:
      - public/downloads/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish v1.4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4
          name: works 1.4
          body: |
            Сборки приложения works 1.4 со встроенной средой выполнения.

            Что добавлено:
            - ход назад в мини-играх
            - уровни судоку: лёгкий, средний и сложный
            - подсказка в косынке
            - счёт побед в шашках, реверси и косынке
            - в шахматах новые фигуры и предупреждение «Шах»
            - будильник можно отложить на 5 минут
            - в расписании у дела есть время и повтор: один раз, каждый день или выбранные дни
            - в настройках включается сигнал для напоминаний, будильника и таймера

            - macOS: распакуйте архив и откройте works.app
            - Windows: распакуйте архив и запустите works.exe рядом с каталогом runtime
          files: |
            public/downloads/1.4/works-macos.zip
            public/downloads/1.4/works-windows.zip
          fail_on_unmatched_files: true
