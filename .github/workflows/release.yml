name: Release

on:
  push:
    branches: [main]
    paths:
      - public/downloads/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish v1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: works 1.0
          body: |
            Сборки приложения works со встроенной средой выполнения.

            - macOS: распакуйте архив и откройте works.app
            - Windows: распакуйте архив и запустите works.exe рядом с каталогом runtime
          files: |
            public/downloads/works-macos.zip
            public/downloads/works-windows.zip
          fail_on_unmatched_files: true
