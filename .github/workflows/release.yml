name: Release

on:
  push:
    branches: [main]
    paths:
      - public/downloads/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish v1.6
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6
          name: works 1.6
          body: |
            Сборки приложения works 1.6 со встроенной средой выполнения.

            Что добавлено:
            - мини-игра «Пятнашки» и рекорд по числу ходов
            - в заметках папки, свой цвет и цветные прямоугольники
            - zip-архив в хранилище открывается как папка, поиск заходит внутрь
            - на часах можно показать время другого города
            - в калькуляторе перевод площади, объёма, времени и размера данных
            - помодоро: работа и перерыв рядом с таймером
            - в сапёре поля 9×9 и 16×16, лёгкое и сложное, и рекорд по времени
            - в диктофоне запись можно обрезать и переименовать
            - в редакторе фото кисти «Прямоугольник», «Овал» и «Стрелка»
            - голосом открываются ещё календарь, расписание и корзина

            - macOS: распакуйте архив и откройте works.app
            - Windows: распакуйте архив и запустите works.exe рядом с каталогом runtime
          files: |
            public/downloads/1.6/works-macos.zip
            public/downloads/1.6/works-windows.zip
          fail_on_unmatched_files: true
