name: Release

on:
  push:
    branches: [main]
    paths:
      - public/downloads/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish v1.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          name: works 1.1
          body: |
            Сборки приложения works 1.1 со встроенной средой выполнения.

            - macOS: распакуйте архив и откройте works.app
            - Windows: распакуйте архив и запустите works.exe рядом с каталогом runtime

            Версия 1.0 остаётся на странице сайта.
          files: |
            public/downloads/1.1/works-macos.zip
            public/downloads/1.1/works-windows.zip
          fail_on_unmatched_files: true
