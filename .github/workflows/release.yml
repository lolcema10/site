name: Release

on:
  push:
    branches: [main]
    paths:
      - public/downloads/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish v1.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: works 1.2
          body: |
            Сборки приложения works 1.2 со встроенной средой выполнения.

            Что добавлено:
            - таймер и секундомер
            - мини-игры «Судоку» и «Шашки»
            - закрепление заметок
            - метроном в пианино
            - своя картинка на фон в настройках
            - отмена последнего шага в редакторах видео и звука

            - macOS: распакуйте архив и откройте works.app
            - Windows: распакуйте архив и запустите works.exe рядом с каталогом runtime
          files: |
            public/downloads/1.2/works-macos.zip
            public/downloads/1.2/works-windows.zip
          fail_on_unmatched_files: true
