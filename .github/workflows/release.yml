name: Release

on:
  push:
    branches: [main]
    paths:
      - public/downloads/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish v1.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: works 1.3
          body: |
            Сборки приложения works 1.3 со встроенной средой выполнения.

            Что добавлено:
            - будильник вместе с таймером и секундомером
            - мини-игры «Шахматы» и «Морской бой»
            - счёт партий и побед в мини-играх
            - перевод температуры, длины и веса в калькуляторе
            - закрепление файлов
            - галочки в заметках
            - снимок экрана и пипетка в редакторе фото

            - macOS: распакуйте архив и откройте works.app
            - Windows: распакуйте архив и запустите works.exe рядом с каталогом runtime
          files: |
            public/downloads/1.3/works-macos.zip
            public/downloads/1.3/works-windows.zip
          fail_on_unmatched_files: true
